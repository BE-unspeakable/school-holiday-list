<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4CAF50">
    <meta name="description" content="School Holiday List - Track your holidays easily">
    <title>School Holiday List</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%234CAF50' width='192' height='192'/><text x='50%' y='50%' font-size='100' fill='white' text-anchor='middle' dominant-baseline='middle'>📅</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">School Planner</p>
                <h1>📅 Holiday List</h1>
            </div>
            <button id="installBtn" class="install-btn hidden">⬇️ Install App</button>
        </header>

        <div id="notificationBar" class="notification-bar hidden">
            <span id="notificationText">Holiday tomorrow!</span>
        </div>

        <section class="status-grid">
            <article class="status-card">
                <div class="label-row">
                    <span class="label">Today</span>
                    <span id="todayEmoji" class="emoji-badge">🙂</span>
                </div>
                <p id="todayStatusText" class="status-text">Regular day</p>
            </article>

            <article class="status-card">
                <div class="label-row">
                    <span class="label">Tomorrow</span>
                    <span id="tomorrowEmoji" class="emoji-badge">🙂</span>
                </div>
                <p id="tomorrowStatusText" class="status-text">Regular day</p>
            </article>
        </section>

        <section class="card">
            <h2>Add New Holiday</h2>
            <div class="add-form">
                <input id="holidayName" type="text" placeholder="Holiday name" maxlength="50" />
                <input id="holidayFromDate" type="date" placeholder="From" />
                <input id="holidayToDate" type="date" placeholder="To" />
                <button id="addHolidayBtn" class="primary-btn">Add</button>
            </div>
        </section>

        <section class="card">
            <div class="section-header">
                <h2>🎉 Upcoming Holidays</h2>
            </div>
            <div id="upcomingList" class="holiday-list"></div>
            <button id="showMoreBtn" class="secondary-btn hidden">Show more</button>
        </section>

        <section class="card">
            <div class="section-header">
                <h2>📜 Past Holidays</h2>
            </div>
            <div id="pastList" class="holiday-list"></div>
        </section>
    </div>

    <div id="permissionModal" class="modal hidden">
        <div class="modal-box">
            <h3>Enable Holiday Notifications?</h3>
            <p>Get a reminder when a holiday is coming up tomorrow.</p>
            <div class="modal-actions">
                <button id="allowNotifyBtn" class="primary-btn">Allow</button>
                <button id="denyNotifyBtn" class="secondary-btn">Not now</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
