<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <meta name="description" content="School Holiday List - Track your holidays easily">
    <title>School Holiday List</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><defs><linearGradient id='grad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' style='stop-color:%23667eea;stop-opacity:1' /><stop offset='100%' style='stop-color:%23764ba2;stop-opacity:1' /></linearGradient></defs><rect fill='url(%23grad)' width='192' height='192'/><text x='50%' y='50%' font-size='100' fill='white' text-anchor='middle' dominant-baseline='middle'>📅</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="header-content">
                <p class="eyebrow">School Planner</p>
                <h1>📅 Holiday List</h1>
            </div>
            <div class="header-buttons">
                <button id="installBtn" class="install-btn hidden">📱 Install App</button>
                <button id="notificationBtn" class="notification-permission-btn hidden">🔔 Enable Notifications</button>
            </div>
        </header>

        <div id="notificationBar" class="notification-bar hidden">
            <span id="notificationText">Holiday tomorrow!</span>
        </div>

        <section class="status-grid">
            <article class="status-card">
                <div class="label-row">
                    <span class="label">Today</span>
                    <span id="todayEmoji" class="emoji-badge">🙂</span>
                </div>
                <p id="todayStatusText" class="status-text">Regular day</p>
            </article>

            <article class="status-card">
                <div class="label-row">
                    <span class="label">Tomorrow</span>
                    <span id="tomorrowEmoji" class="emoji-badge">🙂</span>
                </div>
                <p id="tomorrowStatusText" class="status-text">Regular day</p>
            </article>
        </section>

        <section class="card">
            <h2>Add New Holiday</h2>
            <div class="add-form">
                <input id="holidayName" type="text" placeholder="Holiday name" maxlength="50" />
                <input id="holidayFromDate" type="date" />
                <input id="holidayToDate" type="date" />
                <button id="addHolidayBtn" class="primary-btn">Add Holiday</button>
            </div>
        </section>

        <section class="card">
            <div class="section-header">
                <h2>🎉 Holiday List</h2>
            </div>

            <div class="controls-row">
                <div class="search-box">
                    <input id="searchInput" type="text" placeholder="🔍 Search holidays..." />
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn" data-filter="all">All</button>
                    <button class="filter-btn active" data-filter="upcoming">Upcoming</button>
                    <button class="filter-btn" data-filter="past">Past</button>
                </div>
            </div>

            <div class="table-wrapper">
                <table id="holidayTable" class="holiday-table">
                    <thead>
                        <tr>
                            <th>Holiday Name</th>
                            <th>Type</th>
                            <th>From</th>
                            <th>To</th>
                            <th>Duration</th>
                            <th>Status</th>
                            <th>Days</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr class="no-data">
                            <td colspan="7">No holidays found</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="table-actions">
                <button id="showMoreBtn" class="show-more-btn hidden">📋 Show more</button>
            </div>
        </section>
    </div>

    <div id="permissionModal" class="modal hidden">
        <div class="modal-box">
            <h3>🔔 Enable Notifications?</h3>
            <p>Get a reminder when a holiday is coming up tomorrow.</p>
            <div class="modal-actions">
                <button id="allowNotifyBtn" class="primary-btn">Allow Notifications</button>
                <button id="denyNotifyBtn" class="secondary-btn">Not now</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
